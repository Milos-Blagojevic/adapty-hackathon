plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.resolve.mockchat'
    compileSdk 34

    defaultConfig {
        applicationId 'io.resolve.mockchat'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
// No dependencies: plain android.* views, HttpURLConnection, org.json (all in the platform).
