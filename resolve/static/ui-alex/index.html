<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resolve · Lumen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">L</div>
      <div>
        <div class="brand-name" id="app-name">Lumen</div>
        <div class="brand-sub">Resolve · support</div>
      </div>
    </div>
    <div class="nav-label">Support</div>
    <nav class="nav">
      <a href="#/incoming" data-tab="incoming">
        <svg viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5M5 5h14l2 8v6H3v-6z"/></svg>
        <span>Incoming</span><span class="nav-count" id="nav-count"></span>
      </a>
      <a href="#/analyze" data-tab="analyze">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Analyze</span>
      </a>
    </nav>
    <div class="nav-label">Level 2 agent</div>
    <nav class="nav">
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span>Agent settings</span>
      </a>
      <a href="#/chat" data-tab="chat">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>
        <span>Chat debug</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="mode-badge" id="mode-badge" hidden>mock data</div>
      <div class="foot-note">Built on Adapty · Hackathon Belgrade</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="crumb" id="crumb">Support</div>
        <h1 id="page-title">Incoming</h1>
      </div>
      <div class="topbar-right" id="topbar-right"></div>
    </header>
    <section class="view" id="view"><div class="empty">Loading…</div></section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
