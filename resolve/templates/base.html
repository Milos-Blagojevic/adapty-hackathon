<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resolve{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/inbox">Resolve</a>
  <nav>
    <a href="/inbox" {% if request.url.path == '/inbox' %}class="on"{% endif %}>Inbox</a>
    <a href="/insights" {% if request.url.path.startswith('/insights') %}class="on"{% endif %}>Insights</a>
  </nav>
  <span class="app">FitBuddy – a fitness app</span>
  {% if demo %}<span class="badge demo" title="No keys: cached profiles and triage; Accept changes local state only">DEMO MODE</span>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>Tickets are synthetic. Profiles, grants and A/B drafts are real Adapty calls on the seeded FitBuddy app. Nothing is ever sent to a user.</footer>
</body>
</html>
